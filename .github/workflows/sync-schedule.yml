name: Sync Indieplus Pohang Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Dtryx public schedule
        run: python scripts/sync_dtryx.py
      - name: Commit changes
        run: |
          git config user.name "indieplus-pohang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "data: sync Dtryx schedule"
          git push
